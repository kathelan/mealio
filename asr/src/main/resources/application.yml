spring:
  application:
    name: mealio-asr
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mealio?currentSchema=asr}
    username: ${SPRING_DATASOURCE_USERNAME:mealio}
    password: ${SPRING_DATASOURCE_PASSWORD:mealio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${MEALIO_DB_SCHEMA:asr}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: ${MEALIO_DB_SCHEMA:asr}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mealio:
  audit:
    http:
      service-name: ${MEALIO_SERVICE_NAME:mealio-asr}
      environment: ${MEALIO_ENVIRONMENT:local}
  asr:
    provider: ${MEALIO_ASR_PROVIDER:mock}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${MEALIO_ASR_OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${MEALIO_ASR_OPENAI_MODEL:gpt-4o-mini-transcribe}
