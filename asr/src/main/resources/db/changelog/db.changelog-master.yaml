databaseChangeLog:
  - changeSet:
      id: 001-create-transcriptions
      author: mealio
      changes:
        - createTable:
            tableName: transcriptions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transcript
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: varchar(16)
              - column:
                  name: provider
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: model
                  type: varchar(128)
              - column:
                  name: confidence
                  type: numeric(5, 4)
              - column:
                  name: audio_filename
                  type: varchar(512)
              - column:
                  name: audio_content_type
                  type: varchar(128)
              - column:
                  name: audio_size_bytes
                  type: bigint
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: COMPLETED
                  constraints:
                    nullable: false
              - column:
                  name: error_code
                  type: varchar(96)
              - column:
                  name: error_message
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: transcribed_at
                  type: timestamp with time zone
        - createIndex:
            tableName: transcriptions
            indexName: idx_transcriptions_created_at
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: transcriptions
            indexName: idx_transcriptions_provider
            columns:
              - column:
                  name: provider
