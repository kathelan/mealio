<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mealio — produkty i dziennik · low-fi 003</title><style>
:root{--ink:#20251f;--muted:#71786f;--line:#e6e9e3;--paper:#fbfcf9;--green:#2c6c4c;--soft:#edf5ee;--orange:#fff2dd;--red:#9b4337}*{box-sizing:border-box}body{margin:0;background:#f2f4f0;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1120px;min-height:100vh;margin:auto;display:grid;grid-template-columns:210px 1fr;background:var(--paper);box-shadow:0 12px 50px #17271912}.rail{padding:30px 20px;border-right:1px solid var(--line)}.logo{font-size:24px;font-weight:750;letter-spacing:-1px}.logo b{color:var(--green)}.tag{font-size:11px;color:#738075;letter-spacing:.1em;text-transform:uppercase;margin:30px 0 10px}.nav{display:grid;gap:6px}.nav button{border:0;text-align:left;background:transparent;padding:12px;border-radius:10px;color:#555e55;cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:var(--green);font-weight:650}.aside{margin-top:36px;border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--muted);font-size:12px}.main{padding:30px 42px 130px;max-width:900px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:32px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8eee7;display:grid;place-items:center;color:var(--green);font-weight:700}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--green);text-transform:uppercase}.title{font-size:30px;line-height:1.15;letter-spacing:-.7px;margin:7px 0}.sub{color:var(--muted);margin:0 0 24px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.choice{padding:20px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left;cursor:pointer}.choice:hover{border-color:#9dbba2;box-shadow:0 5px 20px #1c39220d}.icon{font-size:23px}.choice strong{display:block;margin:10px 0 3px;font-size:16px}.choice span:last-child,.small{font-size:13px;color:var(--muted)}input,select{font:inherit;border:1px solid #dfe4dd;border-radius:9px;padding:12px;background:#fff;color:var(--ink);width:100%;outline:none}input:focus,select:focus{border-color:#78a186;box-shadow:0 0 0 3px #2c6c4c18}.search{position:relative;margin:18px 0}.search input{padding-left:42px}.search:before{content:'⌕';position:absolute;left:14px;top:7px;font-size:24px;color:#778078}.pill{display:inline-block;background:#f1f3f0;border-radius:99px;padding:4px 9px;font-size:11px;color:#697268;margin:3px}.pill.green{background:var(--soft);color:var(--green)}.pill.amber{background:var(--orange);color:#875a1f}.product{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #eef0ec}.product:last-child{border:0}.food{width:44px;height:44px;border-radius:11px;background:#f4f1e8;display:grid;place-items:center;font-size:23px}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--green);color:#fff;font-weight:650;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#f0f3ef;color:var(--ink)}.btn.text{background:transparent;color:var(--green);padding:8px}.btn.danger{background:#fff0ed;color:var(--red)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.field{margin:14px 0}.field label{font-size:12px;font-weight:650;display:block;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{border-radius:11px;padding:13px 15px;background:#f1f5f0;color:#3d6149;font-size:13px;margin:14px 0}.notice.warn{background:#fff5e7;color:#845a22}.notice.error{background:#fff0ed;color:#984c3f}.sectiontitle{font-size:16px;font-weight:700;margin:22px 0 7px}.divider{height:1px;background:var(--line);margin:18px 0}.tagline{color:var(--muted);font-size:12px}.steps{display:flex;gap:7px;margin:18px 0}.step{font-size:11px;padding:6px 10px;border-radius:99px;background:#f0f2ef;color:#737b71}.step.on{background:var(--soft);color:var(--green);font-weight:650}.back{border:0;background:none;color:var(--muted);padding:0;margin:0 0 18px;cursor:pointer}.modalback{position:fixed;inset:0;background:#18251d66;display:grid;place-items:center;padding:20px}.modal{max-width:490px;width:100%;background:white;border-radius:16px;padding:23px;box-shadow:0 20px 60px #11221630}.modal h2{margin:0 0 7px}.footer{font-size:11px;color:#999f97;text-align:center;padding:20px}.meal-card{padding:16px 18px}.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.meal-head h2{font-size:16px;margin:0}.meal-items{padding:8px 0 3px}.diary-entry{padding:7px 0;border-bottom:1px solid #eef0ec}.diary-entry:last-of-type{border-bottom:0}.diary-item{display:flex;justify-content:space-between;gap:12px;color:#50584e;font-size:13px}.diary-item-macros{font-size:11px;color:var(--muted);margin-top:3px}.meal-actions{display:flex;gap:5px;margin-top:8px}.daily-summary{position:relative;margin-top:14px;display:flex;align-items:center;justify-content:space-between;border:1px solid #dfe5dd;border-radius:13px;background:#f4f7f3f5;backdrop-filter:blur(8px);padding:15px 18px;box-shadow:0 5px 18px #12201612}.daily-summary strong{font-size:23px}.daily-macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.daily-macro{border-top:1px solid #dfe5dd;padding-top:9px;color:var(--muted);font-size:12px}.daily-macro strong{display:block;color:var(--ink);font-size:16px;margin-top:2px}.meal-summary{margin:9px 0 2px;padding:10px 12px;border-radius:10px;background:#f4f7f3}.meal-summary-title{font-size:11px;font-weight:700;color:#536354;margin-bottom:7px}.meal-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.meal-summary-value{font-size:12px;color:var(--muted)}.meal-summary-value strong{display:block;color:var(--ink);font-size:14px;margin-top:2px}.settings-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:9px 0}.settings-row button{padding:8px}.settings-note{font-size:12px;color:var(--muted);margin-top:10px}.hidden{display:none!important}@media(max-width:720px){.app{display:block}.rail{display:none}.main{padding:20px 16px 130px}.daily-summary{padding:12px 14px}.daily-macros{gap:6px}.daily-macro{font-size:11px}.daily-macro strong{font-size:14px}.meal-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.daily-summary strong{font-size:20px}.title{font-size:27px}.choices{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.product{grid-template-columns:42px 1fr}.product .btn{grid-column:2;justify-self:start}.top{margin-bottom:25px}}

[hidden]{display:none!important}label{display:block;margin:10px 0 5px}h1:focus{outline:none}.partial{color:#845a22}.stack{display:grid;gap:8px}button:focus-visible{outline:3px solid #78a186;outline-offset:3px}
</style></head><body><div class="app"><aside class="rail"><div class="logo">mealio<b>.</b></div><nav class="nav"><button onclick="go('home')">Dziennik</button><button onclick="openSearch()">Produkty</button><button onclick="go('scan')">Skanuj kod</button></nav><p class="small">Lokalna makieta · fikcyjne dane. Dziennik jest hostem E02; produkcyjne obliczenia wykona backend.</p></aside><main class="main"><div class="top"><span>Makieta przepływu · revision-003</span><button onclick="reset()" class="btn text">Reset makiety</button></div><div id="app"></div><p class="footer">Dane wyłącznie w pamięci karty · bez kamery i API</p></main></div><script>
const keys=['kcal','protein','fat','carbs'],labels={kcal:'Energia',protein:'Białko',fat:'Tłuszcz',carbs:'Węglowodany'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':new Intl.NumberFormat('pl-PL',{maximumFractionDigits:3}).format(v);
const unit=k=>k==='kcal'?'kcal':'g';const text=(v,k)=>v==null?'—':num(v)+' '+unit(k);
let products,diary,sections,selectedSection,selectedId,selectedVersion,mode,formDraft,scanReason,screen,candidate,editExpected;
const provenance=(source)=>Object.fromEntries(['name','brand','basis','piece',...keys].map(k=>[k,{source,reference:''}]));
function fixture(id,name,brand,stores,nutrition,gtin=null,piece=null){return {id,gtin,stores,versions:[{number:1,name,brand,basis:'g',piece,...nutrition,provenance:provenance('etykieta')}]}}
function reset(){products=[fixture('p1','Ziemniaki mrożone','Farm Fresh',['Market A'],{kcal:152,protein:2.4,fat:5.1,carbs:23},'05901234123457'),fixture('p2','Ziemniaki mrożone','Frost Kitchen',['Sklep Lokalny'],{kcal:150,protein:null,fat:5,carbs:22}),fixture('p3','Jajko kurze','',['Market A'],{kcal:155,protein:13,fat:11,carbs:1.1},null,55)];diary=[{section:'Śniadanie',snapshot:{name:'Owsianka z bananem',number:1},kcal:320,protein:10,fat:8,carbs:50},{section:'Drugie śniadanie',snapshot:{name:'Jabłko',number:1},kcal:95,protein:0.4,fat:0.2,carbs:23},{section:'Obiad',snapshot:{name:'Makaron z sosem',number:1},kcal:480,protein:18,fat:16,carbs:60}];sections=['Śniadanie','Drugie śniadanie','Obiad','Lunch','Kolacja','Przekąski'];selectedSection=sections[0];selectedId='p1';selectedVersion=null;formDraft=null;scanReason='';candidate=null;go('home')}
function current(){let p=products.find(p=>p.id===selectedId);return p.versions.find(v=>v.number===selectedVersion)||p.versions.at(-1)}
function total(entries,k){let known=entries.filter(e=>e[k]!=null);return {value:entries.length===0?0:known.length?known.reduce((a,e)=>a+e[k],0):null,partial:known.length<entries.length}}
function totals(entries){return '<div class="meal-summary-grid">'+keys.map(k=>{let t=total(entries,k);return '<div class="meal-summary-value">'+labels[k]+'<strong>'+text(t.value,k)+(t.partial?' · suma znanych · PARTIAL':'')+'</strong></div>'}).join('')+'</div>'}
function values(v){return '<div class="grid2">'+keys.map(k=>'<span>'+labels[k]+' <b>'+text(v[k],k)+'</b></span>').join('')+'</div>'}
function button(label,action,secondary=false){return '<button class="btn '+(secondary?'secondary':'')+'" onclick="'+action+'">'+label+'</button>'}
function go(id,push=true){screen=id;if(push&&location.hash!=='#'+id)location.hash=id;render();document.querySelector('h1')?.focus();window.scrollTo(0,0)}
function openSearch(section){if(section)selectedSection=section;scanReason='';go('search')}
function choose(id){selectedId=id;selectedVersion=null;go('detail')}
function render(){let html='';
if(screen==='home'){html='<h1 tabindex="-1">Dziennik</h1><p>Dzisiejszy dzień · fikcyjne wpisy</p>';for(const section of sections){let entries=diary.filter(e=>e.section===section);html+='<div class="card"><h2>'+esc(section)+'</h2>'+entries.map(e=>'<p>'+esc(e.snapshot.name)+' · wersja '+e.snapshot.number+'</p>'+values(e)).join('')+(entries.length?'':'<p>Brak wpisów</p>')+'<div class="meal-summary"><strong>Suma całego posiłku</strong>'+totals(entries)+'</div><div class="actions">'+button('Dodaj produkt',"openSearch('"+section+"')")+button('Skanuj kod',"selectedSection='"+section+"';go('scan')",true)+'</div></div>'}html+='<div class="card"><h2>Kalorie i makra zjedzone dziś</h2>'+totals(diary)+'</div>'}
else if(screen==='search'){html='<h1 tabindex="-1">Dodaj do: '+esc(selectedSection)+'</h1><label for="query">Szukaj produktu</label><input id="query" oninput="filter()" placeholder="np. ziemniaki"><div class="actions">'+button('Dodaj własny',"startForm('create')")+button('Wróć',"go('home')",true)+'</div><div id="results"></div>'}
else if(screen==='detail'){let p=products.find(p=>p.id===selectedId),v=current();html='<h1 tabindex="-1">'+esc(v.name)+'</h1><p>'+esc(v.brand||'Produkt własny')+' · '+esc(p.stores.join(', ')||'Bez sklepów')+'</p><div class="card"><p>Wersja '+v.number+' · na 100 '+v.basis+' · '+(keys.some(k=>v[k]==null)?'INCOMPLETE':'kompletne')+'</p>'+values(v)+(v.piece?'<p>1 szt. = '+num(v.piece)+' '+v.basis+'</p>':'')+'<h2>Pochodzenie pól</h2>'+['name','brand','basis',...keys].map(k=>'<p>'+esc(labels[k]||k)+': '+(keys.includes(k)&&v[k]==null?'brak wartości':esc(v.provenance[k].source)+(v.provenance[k].reference?' · '+esc(v.provenance[k].reference):''))+'</p>').join('')+'<div class="actions">'+button('Wybierz ilość',"go('quantity')")+button('Popraw produkt',"startForm('revise')",true)+button('Edytuj sklepy',"go('stores')",true)+button('Historia wersji',"go('history')",true)+button('Wróć do wyników',"openSearch()",true)+'</div></div>'}
else if(screen==='quantity'){let v=current();html='<h1 tabindex="-1">Ilość: '+esc(v.name)+'</h1><label for="amount">Ilość</label><input id="amount" type="number" min="0.000001" step="any" value="100" oninput="preview()"><label for="quantity-unit">Jednostka</label><select id="quantity-unit" onchange="preview()"><option value="base">'+v.basis+'</option>'+(v.piece?'<option value="piece">szt.</option>':'')+'</select><div id="preview" class="card"></div><p id="error" role="alert"></p><div class="actions">'+button('Dodaj do posiłku','addEntry()')+button('Popraw produkt',"startForm('revise')",true)+button('Anuluj',"go('detail')",true)+'</div>'}
else if(screen==='create'||screen==='revise'||screen==='confirm'){let d=formDraft;html='<h1 tabindex="-1">'+(mode==='revise'?'Popraw produkt':mode==='confirm'?'Potwierdź propozycję':'Dodaj ręcznie')+'</h1>'+(scanReason?'<p class="notice warn">'+esc(scanReason)+'</p>':'')+'<p>Wymagane: nazwa i podstawa. Brakujące kcal/makro pozostaw puste; zero wpisz jawnie.</p><form onsubmit="event.preventDefault();saveForm()"><label for="name">Nazwa *</label><input id="name" value="'+esc(d.name)+'"><label for="brand">Marka</label><input id="brand" value="'+esc(d.brand)+'"><label for="basis">Podstawa *</label><select id="basis"><option value="g" '+(d.basis==='g'?'selected':'')+'>100 g</option><option value="ml" '+(d.basis==='ml'?'selected':'')+'>100 ml</option></select>'+keys.map(k=>'<label for="'+k+'">'+labels[k]+' na 100 g/ml (opcjonalne)</label><input type="number" min="0" step="any" id="'+k+'" value="'+esc(d[k])+'">').join('')+'<label for="piece">1 szt. = ile g/ml podstawy? (opcjonalne)</label><input type="number" min="0.000001" step="any" id="piece" value="'+esc(d.piece)+'">'+(mode==='create'?'<label for="gtin">GTIN (opcjonalnie; fikcyjny scenariusz)</label><input id="gtin" value="'+esc(d.gtin)+'"><label for="stores">Sklepy, po jednym w wierszu</label><textarea id="stores">'+esc(d.stores.join('\n'))+'</textarea>':'')+'<label for="reference">Referencja zmienionych pól (opcjonalnie)</label><input id="reference" maxlength="500" value="'+esc(d.reference||'')+'"><p id="error" role="alert"></p><div class="actions"><button class="btn" type="submit">'+(mode==='revise'?'Zapisz nową wersję':'Zapisz produkt')+'</button><button class="btn secondary" type="button" onclick="go(\'search\')">Anuluj</button></div></form>'}
else if(screen==='stores'){html='<h1 tabindex="-1">Sklepy produktu</h1><p>Osobne metadane; zmiana nie tworzy wersji żywieniowej.</p><label for="stores">Własne nazwy, po jednej w wierszu</label><textarea id="stores">'+esc(products.find(p=>p.id===selectedId).stores.join('\n'))+'</textarea><p id="error" role="alert"></p>'+button('Zapisz sklepy','saveStores()')+button('Anuluj',"go('detail')",true)}
else if(screen==='history'){let p=products.find(p=>p.id===selectedId);html='<h1 tabindex="-1">Historia wersji</h1>'+p.versions.map(v=>'<div class="card"><h2>Wersja '+v.number+' · '+esc(v.name)+'</h2><p>'+esc(v.brand)+'</p>'+values(v)+button('Pokaż tę wersję',"selectedVersion="+v.number+";go('detail')",true)+'</div>').join('')+button('Wróć',"selectedVersion=null;go('detail')",true)}
else if(screen==='scan'){html='<h1 tabindex="-1">Skanuj kod</h1><p>Wybór scenariusza zastępuje aparat. Znany lokalny produkt pomija potwierdzenie.</p><div class="stack">'+button('Produkt lokalny',"selectedId='p1';selectedVersion=null;go('quantity')")+button('Dane zewnętrzne',"externalCandidate()")+button('Nie znaleziono',"fallback('NOT_FOUND — nie znaleziono w sprawdzonym źródle')",true)+button('Źródło niedostępne',"fallback('PROVIDER_UNAVAILABLE — awaria nie oznacza braku produktu')",true)+button('Limit zapytań',"fallback('PROVIDER_RATE_LIMITED — limit nie oznacza braku produktu')",true)+button('Odmowa aparatu',"fallback('Brak dostępu do aparatu; wyszukaj produkt lub wpisz kod ręcznie')",true)+button('Wróć',"go('home')",true)+'</div>'}
else if(screen==='conflict'){html='<h1 tabindex="-1">Konflikt GTIN</h1><p>Kod jest już przypisany. Dane nie zostały zapisane.</p>'+button('Użyj istniejącego',"go('detail')")+button('Popraw istniejący',"startForm('revise')",true)+button('Anuluj',"go('search')",true)}
else if(screen==='done'){html='<h1 tabindex="-1">Dodano do posiłku</h1><p>'+esc(selectedSection)+'</p>'+button('Gotowe',"go('home')")}
else if(screen==='fallback'){html='<h1 tabindex="-1">Wynik skanu</h1><p class="notice warn">'+esc(scanReason)+'</p>'+button('Dodaj ręcznie',"startForm('create')")+button('Szukaj lokalnie',"openSearch()",true)}
else {html='<h1 tabindex="-1">Nieznany ekran</h1>'+button('Wróć do początku',"go('home')")}
document.getElementById('app').innerHTML=html;if(screen==='search')filter();if(screen==='quantity')preview()}
function filter(){let q=document.getElementById('query').value.toLocaleLowerCase('pl');let found=products.filter(p=>{let v=p.versions.at(-1);return [v.name,v.brand,...p.stores].join(' ').toLocaleLowerCase('pl').includes(q)});document.getElementById('results').innerHTML=found.map(p=>{let v=p.versions.at(-1);return '<div class="card"><strong>'+esc(v.name)+'</strong><p>'+esc(v.brand||'Produkt własny')+' · '+esc(p.stores.join(', '))+' · '+(keys.some(k=>v[k]==null)?'INCOMPLETE':'kompletne')+' · 100 '+v.basis+(v.piece?' · 1 szt. = '+v.piece+' '+v.basis:'')+'</p><p>Pochodzenie: '+esc([...new Set(['name','brand',...keys].filter(k=>v[k]!=null&&v[k]!=='').map(k=>v.provenance[k].source))].join('; '))+'</p>'+button('Wybierz',"choose('"+p.id+"')")+'</div>'}).join('')||'<p>Brak wyników. Dodaj własny produkt.</p>'}
function quantityResult(){let amount=Number(document.getElementById('amount').value),v=current();if(!Number.isFinite(amount)||amount<=0||amount>=1000000)return null;let base=amount*(document.getElementById('quantity-unit').value==='piece'?v.piece:1);return Object.fromEntries(keys.map(k=>[k,v[k]==null?null:v[k]*base/100]))}
function preview(){let result=quantityResult();document.getElementById('preview').innerHTML=result?values(result)+(keys.some(k=>result[k]==null)?'<p class="partial">PARTIAL · brakujące pola pozostają nieznane</p>':''):'Podaj dodatnią ilość mniejszą niż 1000000.'}
function addEntry(){let result=quantityResult();if(!result){document.getElementById('error').textContent='Niepoprawna ilość.';return}diary.push({section:selectedSection,snapshot:structuredClone(current()),...result});go('done')}
function startForm(kind){mode=kind;selectedVersion=null;let base=kind==='revise'?current():kind==='confirm'?candidate:{name:'',brand:'',basis:'g',piece:null,kcal:null,protein:null,fat:null,carbs:null,gtin:scanReason?'05900000000009':'',stores:[]};formDraft=structuredClone(base);formDraft.stores=kind==='create'?base.stores||[]:[];editExpected=kind==='revise'?current().number:null;go(kind==='revise'?'revise':kind==='confirm'?'confirm':'create')}
function readStores(){return [...new Map(document.getElementById('stores').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>[s.toLocaleLowerCase('pl'),s])).values()]}
function saveStores(){let stores=readStores();if(stores.some(s=>s.length>160)){document.getElementById('error').textContent='Nazwa sklepu może mieć do 160 znaków.';return}products.find(p=>p.id===selectedId).stores=stores;go('detail')}
function saveForm(){let error=document.getElementById('error'),d={name:document.getElementById('name').value.trim(),brand:document.getElementById('brand').value.trim(),basis:document.getElementById('basis').value};for(const k of [...keys,'piece']){let raw=document.getElementById(k).value;d[k]=raw===''?null:Number(raw)}let ref=document.getElementById('reference').value.trim();if(!d.name||d.name.length>220||d.brand.length>160||keys.some(k=>d[k]!=null&&(!Number.isFinite(d[k])||d[k]<0))||(d.piece!=null&&(!Number.isFinite(d.piece)||d.piece<=0))){error.textContent='Uzupełnij nazwę i popraw nieujemne dane; przelicznik musi być dodatni.';return}let p,old;if(mode==='revise'){p=products.find(p=>p.id===selectedId);old=p.versions.at(-1);if(old.number!==editExpected){error.textContent='PRODUCT_VERSION_CONFLICT — odczytaj bieżącą wersję.';return}}else{let gtin=mode==='confirm'?candidate.gtin:document.getElementById('gtin').value.trim();let existing=gtin&&products.find(p=>p.gtin===gtin);if(existing){selectedId=existing.id;go('conflict');return}let stores=mode==='create'?readStores():[];if(stores.some(s=>s.length>160)){error.textContent='Nazwa sklepu może mieć do 160 znaków.';return}p={id:'p'+(products.length+1),gtin:gtin||null,stores,versions:[]};old=mode==='confirm'?candidate:null}
d.number=p.versions.length+1;d.provenance={};for(const k of ['name','brand','basis','piece',...keys]){let same=old&&d[k]===old[k]&&(!(keys.includes(k)||k==='piece')||d.basis===old.basis);d.provenance[k]=same?structuredClone(old.provenance[k]):{source:p.gtin?'etykieta użytkownika':'wpis ręczny',reference:ref}}p.versions.push(structuredClone(d));if(mode!=='revise')products.push(p);selectedId=p.id;selectedVersion=null;scanReason='';go('detail')}
function externalCandidate(){candidate={name:'Płatki owsiane',brand:'Marka przykładowa',basis:'g',piece:null,kcal:370,protein:13,fat:7,carbs:60,gtin:'05901234000009',provenance:provenance('Open Food Facts — fikcyjne')};scanReason='Propozycja zewnętrzna; pierwsze potwierdzenie utworzy wersję 1.';startForm('confirm')}
function fallback(reason){scanReason=reason;go('fallback')}
window.addEventListener('hashchange',()=>{let id=location.hash.slice(1)||'home';if(['create','revise','confirm'].includes(id)&&!formDraft)id='search';if(screen!==id)go(id,false)});
reset();
</script></body></html>
