name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

  lint:
    name: Lint Java
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress validate

  unit:
    name: Unit tests and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco-unit/

  integration:
    name: Integration tests PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Require Docker for Testcontainers
        run: docker info
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: |
            **/target/failsafe-reports/
            **/target/site/jacoco-integration/
