name: Verify Java modules

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Docker
        run: docker info
      - name: Verify all Java modules and PostgreSQL migrations
        run: mvn --batch-mode --no-transfer-progress clean verify
