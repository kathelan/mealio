services:
  postgres:
    image: postgres:17-alpine
    container_name: mealio-postgres
    environment:
      POSTGRES_DB: mealio
      POSTGRES_USER: mealio
      POSTGRES_PASSWORD: mealio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealio -d mealio"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mealio-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mealio
      SPRING_DATASOURCE_USERNAME: mealio
      SPRING_DATASOURCE_PASSWORD: mealio
      MEALIO_APPLICATION_NAME: Mealio
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
    container_name: mealio-asr
    environment:
      MEALIO_ASR_PROVIDER: ${MEALIO_ASR_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEALIO_ASR_OPENAI_MODEL: ${MEALIO_ASR_OPENAI_MODEL:-gpt-4o-mini-transcribe}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
