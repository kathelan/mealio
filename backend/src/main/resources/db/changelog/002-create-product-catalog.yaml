databaseChangeLog:
  - changeSet:
      id: 002-create-product-catalog
      author: product
      changes:
        - sql:
            sql: |
              CREATE TABLE ${mealioSchema}.products (
                id UUID PRIMARY KEY,
                gtin VARCHAR(14),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                current_version INTEGER NOT NULL CHECK (current_version > 0),
                revision BIGINT NOT NULL DEFAULT 0,
                CONSTRAINT uk_products_gtin UNIQUE (gtin),
                CONSTRAINT chk_products_gtin_length CHECK (gtin IS NULL OR CHAR_LENGTH(gtin) = 14)
              );
              CREATE TABLE ${mealioSchema}.product_versions (
                id UUID PRIMARY KEY,
                product_id UUID NOT NULL REFERENCES ${mealioSchema}.products(id),
                version_number INTEGER NOT NULL CHECK (version_number > 0),
                name VARCHAR(220) NOT NULL CHECK (CHAR_LENGTH(TRIM(name)) > 0),
                brand VARCHAR(160),
                basis VARCHAR(16) NOT NULL CHECK (basis IN ('PER_100_G', 'PER_100_ML')),
                energy_kcal NUMERIC(12,4) CHECK (energy_kcal >= 0),
                protein NUMERIC(12,4) CHECK (protein >= 0),
                fat NUMERIC(12,4) CHECK (fat >= 0),
                carbohydrates NUMERIC(12,4) CHECK (carbohydrates >= 0),
                verification_status VARCHAR(20) NOT NULL,
                source VARCHAR(16) NOT NULL CHECK (source IN ('USER_LABEL', 'USER_INPUT')),
                recorded_at TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT uk_product_versions_number UNIQUE (product_id, version_number),
                CONSTRAINT chk_product_versions_completeness CHECK (
                  (verification_status = 'USER_CONFIRMED' AND energy_kcal IS NOT NULL
                   AND protein IS NOT NULL AND fat IS NOT NULL AND carbohydrates IS NOT NULL)
                  OR
                  (verification_status = 'INCOMPLETE' AND (energy_kcal IS NULL
                   OR protein IS NULL OR fat IS NULL OR carbohydrates IS NULL))
                )
              );
      rollback:
        - dropTable:
            tableName: product_versions
        - dropTable:
            tableName: products
