spring:
  application:
    name: mealio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mealio?currentSchema=backend}
    username: ${SPRING_DATASOURCE_USERNAME:mealio}
    password: ${SPRING_DATASOURCE_PASSWORD:mealio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${MEALIO_DB_SCHEMA:backend}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: ${MEALIO_DB_SCHEMA:backend}
    parameters:
      mealioSchema: ${MEALIO_DB_SCHEMA:backend}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mealio:
  application-name: Mealio
  audit:
    http:
      service-name: ${MEALIO_SERVICE_NAME:mealio-backend}
      environment: ${MEALIO_ENVIRONMENT:local}
