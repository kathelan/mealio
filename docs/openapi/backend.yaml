openapi: 3.0.3
info:
  title: API backendu Mealio
  version: 0.2.0
  description: API kontroli stanu, kategorii, przepisów oraz wersjonowanego katalogu produktów.
servers:
  - url: http://localhost:8080
    description: Środowisko lokalne
tags:
  - name: Health
  - name: Categories
  - name: Recipes
  - name: Products
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Sprawdzenie stanu aplikacji
      operationId: getApplicationHealth
      responses:
        "200":
          description: Aplikacja działa prawidłowo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Lista kategorii
      operationId: listCategories
      responses:
        "200":
          description: Kategorie uporządkowane według ścieżki.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
    post:
      tags: [Categories]
      summary: Utworzenie kategorii
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Kategoria została utworzona.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "409":
          description: Kategoria o wygenerowanej ścieżce już istnieje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Categories]
      summary: Pobranie kategorii
      operationId: getCategory
      responses:
        "200":
          description: Kategoria została znaleziona.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "404":
          description: Nie znaleziono kategorii.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
    patch:
      tags: [Categories]
      summary: Aktualizacja wybranych pól kategorii
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatchRequest"
      responses:
        "200":
          description: Kategoria została zaktualizowana.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "404":
          description: Nie znaleziono kategorii lub wskazanego rodzica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Nowa ścieżka kategorii koliduje z inną kategorią.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
    delete:
      tags: [Categories]
      summary: Usunięcie pustej kategorii
      operationId: deleteCategory
      responses:
        "204":
          description: Kategoria została usunięta.
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "404":
          description: Nie znaleziono kategorii.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Kategoria ma dzieci i nie może zostać usunięta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
  /api/v1/recipes:
    get:
      tags: [Recipes]
      summary: Lista przepisów
      operationId: listRecipes
      responses:
        "200":
          description: Przepisy uporządkowane malejąco według daty, a następnie nazwy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeResponse"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
    post:
      tags: [Recipes]
      summary: Utworzenie przepisu
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateRequest"
      responses:
        "201":
          description: Przepis został utworzony.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"
        "400":
          $ref: "#/components/responses/InvalidRecipeRequest"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
  /api/v1/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Recipes]
      summary: Pobranie przepisu ze składnikami
      operationId: getRecipe
      responses:
        "200":
          description: Przepis został znaleziony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetailsResponse"
        "400":
          $ref: "#/components/responses/InvalidRecipeRequest"
        "404":
          $ref: "#/components/responses/RecipeNotFound"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
  /api/v1/recipes/{id}/ingredients:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Recipes]
      summary: Dodanie składnika do przepisu
      operationId: addRecipeIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientCreateRequest"
      responses:
        "201":
          description: Składnik został utworzony.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientResponse"
        "400":
          $ref: "#/components/responses/InvalidRecipeRequest"
        "404":
          $ref: "#/components/responses/RecipeNotFound"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
  /api/v1/products:
    get:
      tags: [Products]
      summary: Wyszukiwanie bieżących wersji w katalogu lokalnym
      operationId: searchProducts
      description: Fraza jest dosłownym fragmentem nazwy; sortowanie po nazwie bez rozróżniania wielkości liter i UUID.
      parameters:
        - name: query
          in: query
          schema: {type: string, default: '', maxLength: 220}
        - name: page
          in: query
          description: Offset page * size musi być mniejszy lub równy 2147483647.
          schema: {type: integer, format: int32, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: Pasujące produkty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Nieprawidłowe dane wejściowe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "500":
          description: Katalog lokalny jest niedostępny.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
    post:
      tags: [Products]
      summary: Ręczne potwierdzenie produktu z etykiety lub własnych danych
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Utworzono produkt i pierwszą wersję.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Nieprawidłowe dane wejściowe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "500":
          description: Katalog lokalny jest niedostępny.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "409":
          description: Znormalizowany GTIN już istnieje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
  /api/v1/products/by-gtin/{gtin}:
    get:
      tags: [Products]
      summary: Odczyt lokalnego produktu po GTIN
      operationId: getLocalProductByGtin
      description: Sprawdza wyłącznie katalog Mealio. 404 nie oznacza sprawdzenia dostawców zewnętrznych.
      parameters:
        - name: gtin
          in: path
          required: true
          description: GTIN-8/12/13/14; normalizacja do 14 cyfr i walidacja cyfry kontrolnej.
          schema: {type: string}
      responses:
        "200":
          description: Znaleziono produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Nieprawidłowe dane wejściowe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "500":
          description: Katalog lokalny jest niedostępny.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "404":
          description: Produkt lub wersja nie istnieje w lokalnym katalogu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Odczyt bieżącej wersji produktu
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: UUID produktu.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Znaleziono produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Nieprawidłowe dane wejściowe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "500":
          description: Katalog lokalny jest niedostępny.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "404":
          description: Produkt lub wersja nie istnieje w lokalnym katalogu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
  /api/v1/products/{id}/versions/{version}:
    get:
      tags: [Products]
      summary: Odczyt niezmiennej wersji historycznej
      operationId: getProductVersion
      parameters:
        - name: id
          in: path
          required: true
          description: UUID produktu.
          schema: {type: string, format: uuid}
        - name: version
          in: path
          required: true
          description: Numer wersji.
          schema: {type: integer, format: int32, minimum: 1}
      responses:
        "200":
          description: Znaleziono produkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Nieprawidłowe dane wejściowe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "500":
          description: Katalog lokalny jest niedostępny.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "404":
          description: Produkt lub wersja nie istnieje w lokalnym katalogu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
  /api/v1/products/{id}/versions:
    post:
      tags: [Products]
      summary: Korekta danych przez utworzenie kolejnej wersji
      operationId: reviseProduct
      description: Zachowuje historyczne wersje i GTIN. Wszystkie dane nowej wersji przesyłane są ponownie.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVersionRequest"
      responses:
        "201":
          description: Utworzono nową wersję.
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Nieprawidłowe dane wejściowe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "500":
          description: Katalog lokalny jest niedostępny.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "404":
          description: Nie znaleziono produktu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
        "409":
          description: Wersja produktu uległa zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductError"
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidCategoryRequest:
      description: Żądanie dotyczące kategorii jest nieprawidłowe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    CategoryPersistenceError:
      description: Zapis kategorii nie powiódł się.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InvalidRecipeRequest:
      description: Żądanie dotyczące przepisu lub składnika jest nieprawidłowe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    RecipeNotFound:
      description: Nie znaleziono przepisu.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    RecipePersistenceError:
      description: Zapis przepisu nie powiódł się.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    ProductFields:
      type: object
      required: [name, basis]
      description: Energia w kcal, makroskładniki w gramach na wskazaną podstawę. Null oznacza brak danych.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 220
        brand:
          type: string
          nullable: true
          maxLength: 160
        basis:
          type: string
          enum: [PER_100_G, PER_100_ML]
        energyKcal:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        protein:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        fat:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        carbohydrates:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [name, basis]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 220
        brand:
          type: string
          nullable: true
          maxLength: 160
        basis:
          type: string
          enum: [PER_100_G, PER_100_ML]
        energyKcal:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        protein:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        fat:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        carbohydrates:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        gtin:
          type: string
          nullable: true
          pattern: '^(?:[0-9]{8}|[0-9]{12}|[0-9]{13}|[0-9]{14})$'
          description: Opcjonalny GTIN z poprawną cyfrą kontrolną.
    ProductVersionRequest:
      type: object
      additionalProperties: false
      required: [name, basis, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 220
        brand:
          type: string
          nullable: true
          maxLength: 160
        basis:
          type: string
          enum: [PER_100_G, PER_100_ML]
        energyKcal:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        protein:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        fat:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        carbohydrates:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.9999
          multipleOf: 0.0001
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
    ProductResponse:
      allOf:
        - $ref: "#/components/schemas/ProductFields"
        - type: object
          required: [id, gtin, createdAt, versionId, versionNumber, brand, energyKcal, protein, fat, carbohydrates, verificationStatus, source, recordedAt]
          properties:
            id: {type: string, format: uuid}
            gtin:
              type: string
              nullable: true
              pattern: '^[0-9]{14}$'
            createdAt: {type: string, format: date-time}
            versionId: {type: string, format: uuid}
            versionNumber: {type: integer, format: int32, minimum: 1}
            verificationStatus:
              type: string
              enum: [USER_CONFIRMED, INCOMPLETE]
              description: USER_CONFIRMED wymaga obecności wszystkich czterech wartości; braki nie są zerami.
            source:
              type: string
              enum: [USER_LABEL, USER_INPUT]
              description: Snapshot pól tej wersji pochodzi z ręcznego potwierdzenia etykiety lub własnych danych.
            recordedAt: {type: string, format: date-time}
    ProductError:
      type: object
      required: [code, message, timestamp, requestId]
      properties:
        code:
          type: string
          enum: [INVALID_PRODUCT_REQUEST, PRODUCT_NOT_FOUND, PRODUCT_CONFLICT, PRODUCT_PERSISTENCE_ERROR]
        message: {type: string}
        timestamp: {type: string, format: date-time}
        requestId: {type: string}
    HealthResponse:
      type: object
      required: [status, application, timestamp]
      properties:
        status:
          type: string
          example: UP
        application:
          type: string
          example: mealio-backend
        timestamp:
          type: string
          format: date-time
    CategoryType:
      type: string
      enum: [MEAL, TASTE, CUSTOM]
    CategoryCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 160
        type:
          $ref: "#/components/schemas/CategoryType"
        sortOrder:
          type: integer
          format: int32
          default: 0
    CategoryPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 160
        type:
          allOf:
            - $ref: "#/components/schemas/CategoryType"
          nullable: true
        sortOrder:
          type: integer
          format: int32
          nullable: true
    CategoryResponse:
      type: object
      required: [id, name, slug, path, type, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        path:
          type: string
        type:
          $ref: "#/components/schemas/CategoryType"
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecipeCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 220
        description:
          type: string
          maxLength: 2048
          nullable: true
        createdOn:
          type: string
          format: date
          nullable: true
        imageUrl:
          type: string
          maxLength: 1024
          nullable: true
        categoryIds:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            format: uuid
    RecipeResponse:
      type: object
      required: [id, name, createdOn, categoryIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdOn:
          type: string
          format: date
        imageUrl:
          type: string
          nullable: true
        categoryIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    RecipeDetailsResponse:
      allOf:
        - $ref: "#/components/schemas/RecipeResponse"
        - type: object
          required: [ingredients]
          properties:
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/IngredientResponse"
    MeasurementUnit:
      type: string
      description: Skrócony kod jednostki. Na wejściu akceptowane są także nazwy enumów.
      enum: [g, t, w, ml, pcs]
    IngredientCreateRequest:
      type: object
      required: [name, quantity, unit]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 220
        quantity:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.001
          maximum: 999999999.999
        unit:
          $ref: "#/components/schemas/MeasurementUnit"
        calories:
          type: number
          format: decimal
          minimum: 0
          multipleOf: 0.01
          maximum: 99999999.99
          nullable: true
    IngredientResponse:
      type: object
      required: [id, name, quantity, unit]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: number
        unit:
          $ref: "#/components/schemas/MeasurementUnit"
        calories:
          type: number
          nullable: true
    ApiErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
