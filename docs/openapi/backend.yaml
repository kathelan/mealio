openapi: 3.0.3
info:
  title: API backendu Mealio
  version: 0.1.0
  description: API kontroli stanu, konfigurowalnych kategorii, przepisów i składników.
servers:
  - url: http://localhost:8080
    description: Środowisko lokalne
tags:
  - name: Health
  - name: Categories
  - name: Recipes
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Sprawdzenie stanu aplikacji
      operationId: getApplicationHealth
      responses:
        "200":
          description: Aplikacja działa prawidłowo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Lista kategorii
      operationId: listCategories
      responses:
        "200":
          description: Kategorie uporządkowane według ścieżki.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
    post:
      tags: [Categories]
      summary: Utworzenie kategorii
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Kategoria została utworzona.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "409":
          description: Kategoria o wygenerowanej ścieżce już istnieje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Categories]
      summary: Pobranie kategorii
      operationId: getCategory
      responses:
        "200":
          description: Kategoria została znaleziona.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "404":
          description: Nie znaleziono kategorii.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
    patch:
      tags: [Categories]
      summary: Aktualizacja wybranych pól kategorii
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatchRequest"
      responses:
        "200":
          description: Kategoria została zaktualizowana.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "404":
          description: Nie znaleziono kategorii lub wskazanego rodzica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Nowa ścieżka kategorii koliduje z inną kategorią.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
    delete:
      tags: [Categories]
      summary: Usunięcie pustej kategorii
      operationId: deleteCategory
      responses:
        "204":
          description: Kategoria została usunięta.
        "400":
          $ref: "#/components/responses/InvalidCategoryRequest"
        "404":
          description: Nie znaleziono kategorii.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Kategoria ma dzieci i nie może zostać usunięta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/CategoryPersistenceError"
  /api/v1/recipes:
    get:
      tags: [Recipes]
      summary: Lista przepisów
      operationId: listRecipes
      responses:
        "200":
          description: Przepisy uporządkowane malejąco według daty, a następnie nazwy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeResponse"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
    post:
      tags: [Recipes]
      summary: Utworzenie przepisu
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCreateRequest"
      responses:
        "201":
          description: Przepis został utworzony.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeResponse"
        "400":
          $ref: "#/components/responses/InvalidRecipeRequest"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
  /api/v1/recipes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Recipes]
      summary: Pobranie przepisu ze składnikami
      operationId: getRecipe
      responses:
        "200":
          description: Przepis został znaleziony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetailsResponse"
        "400":
          $ref: "#/components/responses/InvalidRecipeRequest"
        "404":
          $ref: "#/components/responses/RecipeNotFound"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
  /api/v1/recipes/{id}/ingredients:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Recipes]
      summary: Dodanie składnika do przepisu
      operationId: addRecipeIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientCreateRequest"
      responses:
        "201":
          description: Składnik został utworzony.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientResponse"
        "400":
          $ref: "#/components/responses/InvalidRecipeRequest"
        "404":
          $ref: "#/components/responses/RecipeNotFound"
        "500":
          $ref: "#/components/responses/RecipePersistenceError"
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidCategoryRequest:
      description: Żądanie dotyczące kategorii jest nieprawidłowe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    CategoryPersistenceError:
      description: Zapis kategorii nie powiódł się.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InvalidRecipeRequest:
      description: Żądanie dotyczące przepisu lub składnika jest nieprawidłowe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    RecipeNotFound:
      description: Nie znaleziono przepisu.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    RecipePersistenceError:
      description: Zapis przepisu nie powiódł się.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, application, timestamp]
      properties:
        status:
          type: string
          example: UP
        application:
          type: string
          example: mealio-backend
        timestamp:
          type: string
          format: date-time
    CategoryType:
      type: string
      enum: [MEAL, TASTE, CUSTOM]
    CategoryCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 160
        type:
          $ref: "#/components/schemas/CategoryType"
        sortOrder:
          type: integer
          format: int32
          default: 0
    CategoryPatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 160
        type:
          allOf:
            - $ref: "#/components/schemas/CategoryType"
          nullable: true
        sortOrder:
          type: integer
          format: int32
          nullable: true
    CategoryResponse:
      type: object
      required: [id, name, slug, path, type, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        path:
          type: string
        type:
          $ref: "#/components/schemas/CategoryType"
        sortOrder:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecipeCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 220
        description:
          type: string
          maxLength: 2048
          nullable: true
        createdOn:
          type: string
          format: date
          nullable: true
        imageUrl:
          type: string
          maxLength: 1024
          nullable: true
        categoryIds:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            format: uuid
    RecipeResponse:
      type: object
      required: [id, name, createdOn, categoryIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdOn:
          type: string
          format: date
        imageUrl:
          type: string
          nullable: true
        categoryIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    RecipeDetailsResponse:
      allOf:
        - $ref: "#/components/schemas/RecipeResponse"
        - type: object
          required: [ingredients]
          properties:
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/IngredientResponse"
    MeasurementUnit:
      type: string
      description: Skrócony kod jednostki. Na wejściu akceptowane są także nazwy enumów.
      enum: [g, t, w, ml, pcs]
    IngredientCreateRequest:
      type: object
      required: [name, quantity, unit]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 220
        quantity:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.001
          maximum: 999999999.999
        unit:
          $ref: "#/components/schemas/MeasurementUnit"
        calories:
          type: number
          format: decimal
          minimum: 0
          multipleOf: 0.01
          maximum: 99999999.99
          nullable: true
    IngredientResponse:
      type: object
      required: [id, name, quantity, unit]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: number
        unit:
          $ref: "#/components/schemas/MeasurementUnit"
        calories:
          type: number
          nullable: true
    ApiErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
